<!DOCTYPE html>
<html>
<head>
    <title>HustlerX - Job Alerts</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="navbar">
    <div class="logo"><img src="icon.png" alt="HustlerX logo">Hustler<span>X</span></div>
    

    <div>
        <a href="index.html">Home</a>
        <a href="jobs.html">Find Jobs</a>
        <a href="fresh-jobs.html">Fresh Jobs</a>
        <a href="recommended.html">Recommended</a>
        <a href="saved.html">Saved</a>
        <a href="applications.html">Applications</a>
        <a href="alerts.html">Alerts</a>
        <a href="profile.html">Profile</a>
    </div>
</div>

<div class="container">

    <div class="page-title">
        <h1>🔔 Job Alerts</h1>
        <p>Get notified when new jobs match your interests.</p>
    </div>

    <div class="form-box">

        <div class="form-group">
            <label>Job Role</label>
            <input type="text" placeholder="Example: Full Stack Developer">
        </div>

        <div class="form-group">
            <label>Location</label>
            <input type="text" placeholder="Example: Bangalore">
        </div>

        <div class="form-group">
            <label>Job Type</label>

            <select>
                <option>Internship</option>
                <option>Full-Time</option>
                <option>Both</option>
            </select>

        </div>

        <div class="form-group">
            <label>Notify Me When</label>

            <div class="checkbox-group">

                <label>
                    <input type="checkbox">
                    New job is posted
                </label>

                <label>
                    <input type="checkbox">
                    Job matches my skills
                </label>

                <label>
                    <input type="checkbox">
                    Company is hiring
                </label>

                <label>
                    <input type="checkbox">
                    Application deadline is near
                </label>

            </div>

        </div>

        <button class="button">Create Job Alert</button>

    </div>

    <br><br>

    <h2 class="section-title">My Active Alerts</h2>

    <div class="alert-box">

        <div>
            <h3>Full Stack Developer</h3>
            <p>Bangalore • Full-Time</p>
            <p class="fresh">Active</p>
        </div>

        <a href="#" class="outline-button">Delete</a>

    </div>

    <div class="alert-box">

        <div>
            <h3>Software Engineer</h3>
            <p>Remote • Internship</p>
            <p class="fresh">Active</p>
        </div>

        <a href="#" class="outline-button">Delete</a>

    </div>

</div>

</body>
</html>
