<div class="container">


    <div class="page-title">

        <h1>
            Job Alerts
        </h1>

        <p>
            Get notified when a relevant fresh opportunity is available.
        </p>

    </div>


    <form
        class="form-box"
        id="alertForm"
    >


        <div class="form-group">

            <label for="alertEmail">
                Email
            </label>

            <input
                id="alertEmail"
                type="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="alertRole">
                Job Role / Skill
            </label>

            <input
                id="alertRole"
                type="text"
                placeholder="Example: Data Analyst"
                required
                minlength="2"
            >

        </div>


        <div class="form-group">

            <label for="alertLocation">
                Location
            </label>

            <input
                id="alertLocation"
                type="text"
                placeholder="Example: Ahmedabad"
                required
                minlength="2"
            >

        </div>


        <div class="form-group">

            <label for="alertFrequency">
                Alert Frequency
            </label>

            <select
                id="alertFrequency"
                required
            >

                <option value="">
                    Select frequency
                </option>

                <option>
                    Immediately
                </option>

                <option>
                    Daily
                </option>

                <option>
                    Weekly
                </option>

            </select>

        </div>


        <button
            type="submit"
            class="button"
        >
            Create Alert
        </button>


        <div
            id="alertMessage"
            class="form-message"
        ></div>


    </form>


</div>
