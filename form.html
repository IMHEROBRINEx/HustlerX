<!DOCTYPE html>
<html>
<head>
    <title>HustlerX Job Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="section">
        
        <h2>Search for a Job</h2>

        <form>

            <label>Full Name</label><br>
            <input type="text" placeholder="Enter your name"><br><br>

            <label>Email</label><br>
            <input type="email" placeholder="Enter your email"><br><br>

            <label>Job Role</label><br>
            <input type="text" placeholder="Full Stack Developer"><br><br>

            <label>Location</label><br>
            <input type="text" placeholder="Ahmedabad / Remote"><br><br>

            <label>Skills</label><br>
            <input type="text" placeholder="HTML, CSS, JavaScript"><br><br>

            <label>Posted Within</label><br>
            <select>
                <option>Last 24 Hours</option>
                <option>Last 3 Days</option>
                <option>Last 7 Days</option>
            </select><br><br>

            <input type="submit" value="Search Jobs" class="btn">

        </form>

    </div>

</body>
</html>
