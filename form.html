<!DOCTYPE html>

<html>

<head>

    <title>HustlerX - Sign Up</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="navbar">

    <div class="logo">

        <img src="icon.png" alt="HustlerX logo">

        Hustler<span>X</span>

    </div>


    <div class="nav-links">

        <a href="index.html">Home</a>

        <a href="jobs.html">Find Jobs</a>

        <a href="fresh-jobs.html">Fresh Jobs</a>

        <a href="recommended.html">Recommended</a>

        <a href="saved.html">Saved</a>

        <a href="applications.html">Applications</a>

        <a href="alerts.html">Alerts</a>

        <a href="profile.html">Profile</a>

        <a href="form.html" class="active">Sign Up</a>

        <a href="login.html">Login</a>

    </div>

</div>


<div class="container">


    <div class="page-title">

        <h1>
            Create Your Account
        </h1>

        <p>
            Join HustlerX and discover fresh opportunities.
        </p>

    </div>


    <form
        class="form-box"
        id="signupForm"
    >


        <div class="form-group">

            <label for="signupName">
                Full Name
            </label>

            <input
                id="signupName"
                type="text"
                placeholder="Enter your full name"
                required
                minlength="2"
            >

        </div>


        <div class="form-group">

            <label for="signupEmail">
                Email
            </label>

            <input
                id="signupEmail"
                type="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Create a password"
                required
                minlength="8"
            >

        </div>


        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                id="confirmPassword"
                type="password"
                placeholder="Re-enter your password"
                required
                minlength="8"
            >

        </div>


        <div class="form-group">

            <label for="signupCollege">
                College Name
            </label>

            <input
                id="signupCollege"
                type="text"
                placeholder="Enter your college"
                required
                minlength="2"
            >

        </div>


        <div class="form-group">

            <label for="signupYear">
                Graduation Year
            </label>

            <select
                id="signupYear"
                required
            >

                <option value="">
                    Select graduation year
                </option>

                <option>2026</option>
                <option>2027</option>
                <option>2028</option>
                <option>2029</option>
                <option>2030</option>

            </select>

        </div>


        <div class="form-group checkbox-group">

            <label>

                <input
                    type="checkbox"
                    required
                >

                I agree to the HustlerX terms and conditions.

            </label>

        </div>


        <button
            type="submit"
            class="button"
        >
            Create Account
        </button>


        <p class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <div
            id="signupMessage"
            class="form-message"
        ></div>


    </form>


</div>


<div class="footer">

    <p>
        © 2026 HustlerX | Find. Apply. Achieve.
    </p>

</div>


<script src="script.js"></script>

</body>

</html>
