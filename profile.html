<!DOCTYPE html>
<html>
<head>
    <title>HustlerX - Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="navbar">
    <div class="logo">Hustler<span>X</span></div>

    <div>
        <a href="index.html">Home</a>
        <a href="jobs.html">Find Jobs</a>
        <a href="fresh-jobs.html">Fresh Jobs</a>
        <a href="recommended.html">Recommended</a>
        <a href="saved.html">Saved</a>
        <a href="applications.html">Applications</a>
        <a href="alerts.html">Alerts</a>
    </div>
</div>

<div class="container">

    <div class="page-title">
        <h1>Student Profile</h1>
        <p>Tell us about yourself to get better job recommendations.</p>
    </div>

    <div class="form-box">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label>College Name</label>
            <input type="text" placeholder="Enter your college">
        </div>

        <div class="form-group">
            <label>Degree</label>
            <select>
                <option>B.Tech</option>
                <option>BCA</option>
                <option>BBA</option>
                <option>B.Sc</option>
                <option>M.Tech</option>
                <option>Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Branch</label>
            <input type="text" placeholder="Example: ICT, CSE, IT">
        </div>

        <div class="form-group">
            <label>Graduation Year</label>
            <select>
                <option>2026</option>
                <option>2027</option>
                <option>2028</option>
                <option>2029</option>
                <option>2030</option>
            </select>
        </div>

        <div class="form-group">
            <label>CGPA</label>
            <input type="number" placeholder="Enter your CGPA">
        </div>

        <div class="form-group">
            <label>Skills</label>
            <input type="text" placeholder="Example: Python, React, SQL">
        </div>

        <div class="form-group">
            <label>Resume</label>
            <input type="file">
        </div>

        <button class="button">Save Profile</button>

    </div>

</div>

</body>
</html>
