<html>

<head>

    <title>HustlerX - Profile</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="navbar">

    <div class="logo">

        <img src="icon.png" alt="HustlerX logo">

        Hustler<span>X</span>

    </div>


    <div class="nav-links">

        <a href="index.html">Home</a>

        <a href="jobs.html">Find Jobs</a>

        <a href="fresh-jobs.html">Fresh Jobs</a>

        <a href="profile.html" class="active">Profile</a>

        <a href="form.html">Sign Up</a>

        <a href="login.html">Login</a>

    </div>

</div>


<div class="container">


    <div class="page-title">

        <h1>
            Student Profile
        </h1>

        <p>
            Tell us about yourself to get better job recommendations.
        </p>

    </div>


    <form
        class="form-box"
        id="profileForm"
    >


        <div class="form-group">

            <label>
                Full Name
            </label>

            <input
                type="text"
                placeholder="Enter your name"
                required
                minlength="2"
            >

        </div>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label>
                College Name
            </label>

            <input
                type="text"
                placeholder="Enter your college"
                required
                minlength="2"
            >

        </div>


        <div class="form-group">

            <label>
                Degree
            </label>

            <select required>

                <option value="">
                    Select degree
                </option>

                <option>
                    B.Tech
                </option>

                <option>
                    BCA
                </option>

                <option>
                    BBA
                </option>

                <option>
                    B.Sc
                </option>

                <option>
                    M.Tech
                </option>

                <option>
                    Other
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Branch
            </label>

            <input
                type="text"
                placeholder="Example: ICT, CSE, IT"
                required
                minlength="2"
            >

        </div>


        <div class="form-group">

            <label>
                Graduation Year
            </label>

            <select required>

                <option value="">
                    Select graduation year
                </option>

                <option>2026</option>
                <option>2027</option>
                <option>2028</option>
                <option>2029</option>
                <option>2030</option>

            </select>

        </div>


        <div class="form-group">

            <label>
                CGPA
            </label>

            <input
                type="number"
                placeholder="Enter your CGPA"
                required
                min="0"
                max="10"
                step="0.01"
            >

        </div>


        <div class="form-group">

            <label>
                Skills
            </label>

            <input
                type="text"
                placeholder="Example: Python, SQL, Marketing"
                required
                minlength="2"
            >

        </div>


        <div class="form-group">

            <label>
                Resume
            </label>

            <input
                type="file"
                accept=".pdf,.doc,.docx"
                required
            >

        </div>


        <div class="form-group checkbox-group">

            <label>

                <input
                    type="checkbox"
                    required
                >

                I confirm that the information provided is correct.

            </label>

        </div>


        <button
            type="submit"
            class="button"
        >
            Save Profile
        </button>


        <div
            id="profileMessage"
            class="form-message"
        ></div>


    </form>


</div>


<div class="footer">

    <p>
        © 2026 HustlerX | Find. Apply. Achieve.
    </p>

</div>


<script src="script.js"></script>

</body>

</html>
